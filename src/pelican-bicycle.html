<!DOCTYPE html>

<head>

<title>鹈鹕的兜风日记 · SVG 骑行小动画</title>
<style>
  :root { color-scheme: light; --paper: #f7f5ed; --ink: #2c463f; --muted: #7b877b; --accent: #d66e4e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 3px solid #d89648; outline-offset: 5px; }
  .page { max-width: 1160px; margin: auto; padding: 30px 30px 20px; }
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; letter-spacing: 2px; }
  .brand-mark { width: 35px; height: 35px; background: #e5ebdf; border-radius: 50%; padding: 7px; }
  .edition { font-size: 10px; letter-spacing: 2px; color: var(--muted); }
  .intro { margin: 36px 0 27px; display: flex; align-items: end; justify-content: space-between; gap: 18px; }
  .eyebrow { font-size: 10px; letter-spacing: 3px; color: #8b947d; margin: 0 0 12px; }
  h1 { font-family: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif; font-size: clamp(28px, 4vw, 45px); font-weight: 600; letter-spacing: 1px; margin: 0; line-height: 1.35; }
  h1 span { color: #7d8c64; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 13px 0 0; line-height: 1.8; }
  .weather { display: flex; gap: 9px; align-items: center; white-space: nowrap; font-size: 12px; padding-bottom: 7px; color: #7c856f; }
  .weather svg { width: 24px; height: 24px; }
  .postcard { overflow: hidden; border-radius: 22px; border: 1px solid #dedfd1; background: #fffdf5; box-shadow: 0 14px 38px #40543a09; }
  .scene { display: block; width: 100%; height: auto; background: #eef2e7; }
  .controls { min-height: 86px; display: flex; flex-wrap: wrap; align-items: center; gap: 22px; padding: 18px 27px; border-top: 1px solid #e5e2d3; }
  .play { display: inline-flex; align-items: center; gap: 11px; border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 0; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .play-disc { width: 40px; height: 40px; display: grid; place-items: center; background: var(--ink); color: #fffdf5; border-radius: 50%; transition: background .2s, transform .2s; }
  .play:hover .play-disc { background: #54715b; transform: scale(1.05); }
  .play-disc svg { width: 18px; height: 18px; }
  .divider { width: 1px; height: 29px; background: #e3e5d9; }
  .speed { display: flex; align-items: center; gap: 12px; color: #6e7c6c; font-size: 11px; }
  .speed input { width: 116px; accent-color: #718360; cursor: pointer; }
  .speed output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 35px; }
  .ride-state { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 11px; color: #87917e; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #8b9e75; }
  .bell { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #dce0d1; border-radius: 22px; background: transparent; padding: 10px 15px; color: var(--ink); font-size: 12px; cursor: pointer; }
  .bell:hover { background: #edf0e3; }
  .bell svg { width: 16px; height: 16px; }
  .footer { display: flex; justify-content: space-between; gap: 15px; margin: 18px 3px 0; font-size: 10px; letter-spacing: 1px; color: #969c8d; line-height: 1.7; }
  #bell-notes { opacity: 0; }
  @media (max-width: 700px) {
    .page { padding: 20px 15px; } .intro { margin-top: 29px; } .weather { display: none; }
    .edition { font-size: 8px; letter-spacing: 1px; } .brand { font-size: 11px; }
    .postcard { border-radius: 15px; } .controls { padding: 15px; gap: 14px; }
    .ride-state { display: none; } .bell { margin-left: auto; } .speed { gap: 7px; }
    .speed input { width: 82px; } .divider { display: none; } .footer { font-size: 9px; }
  }
  @media (max-width: 420px) {
    .play { gap: 7px; font-size: 11px; } .play-disc { width: 34px; height: 34px; }
    .controls { gap: 13px 10px; } .speed label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .bell { padding: 8px 10px; } .footer span:last-child { display: none; }
  }
</style>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused = motionPreference.matches, speed = 1, time = 0, last = null, bellUntil = 0, audio;
  const parts = Object.fromEntries(['wheel-back', 'wheel-front', 'bird', 'eye', 'scarf-tail', 'crank', 'sun-rays', 'verge', 'bike-shadow', 'breeze', 'gulls', 'boat', 'bell-notes', 'leg-near', 'leg-far', 'foot-near', 'foot-far', 'pedal-near', 'pedal-far', 'cloud-a', 'cloud-b', 'cloud-c'].map(id => [id, $(id)]));
  const set = (id, attribute, value) => parts[id].setAttribute(attribute, value);
  const wrap = (value, min, width) => ((value - min) % width + width) % width + min;
  function updateControls() {
    $('play-icon').setAttribute('d', paused ? 'M7 4L15 10L7 16Z' : 'M6 5v10M14 5v10');
    $('play-icon').setAttribute('fill', paused ? 'currentColor' : 'none');
    $('play-icon').setAttribute('stroke-width', paused ? '1' : '3');
    $('play-label').textContent = paused ? '继续骑行' : '歇一会儿';
    $('play').setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    $('ride-state').textContent = paused ? '停一下，也有好风景' : '不赶时间，只追海风';
  }
  function toggle() { paused = !paused; updateControls(); }
  $('play').addEventListener('click', toggle);
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !event.repeat && !event.target?.closest?.('button, input, select, textarea, a, [contenteditable]')) { event.preventDefault(); toggle(); }
  });
  $('speed').addEventListener('input', event => {
    const value = Number(event.target.value);
    speed = Number.isFinite(value) ? Math.min(2, Math.max(.5, value)) : 1;
    $('speed-value').value = `${speed.toFixed(2).replace(/0$/, '')}×`;
    event.target.setAttribute('aria-valuetext', `${speed} 倍速度`);
  });
  motionPreference.addEventListener('change', event => { if (event.matches) { paused = true; updateControls(); } });
  document.addEventListener('visibilitychange', () => { last = null; });
  $('bell').addEventListener('click', async () => {
    bellUntil = performance.now() + 1100;
    try {
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) return;
      audio ||= new Context();
      if (audio.state === 'suspended') await audio.resume();
      const start = audio.currentTime;
      [0, .13].forEach((delay, index) => {
        [1, 2.76].forEach((harmonic, h) => {
          const oscillator = audio.createOscillator(), gain = audio.createGain();
          oscillator.type = 'sine'; oscillator.frequency.value = (index ? 1568 : 2093) * harmonic;
          gain.gain.setValueAtTime(0, start + delay);
          gain.gain.linearRampToValueAtTime(h ? .018 : .075, start + delay + .005);
          gain.gain.exponentialRampToValueAtTime(.0001, start + delay + .8);
          oscillator.connect(gain); gain.connect(audio.destination);
          oscillator.start(start + delay); oscillator.stop(start + delay + .85);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        });
      });
    } catch { /* A visual bell remains available when browser audio is unavailable. */ }
  });
  function leg(side, angle, bob) {
    const x = 492 + 29 * Math.cos(angle), y = 438 + 29 * Math.sin(angle);
    const hx = side === 'near' ? 474 : 485, hy = 311 + bob;
    const dx = x - hx, dy = y - hy, distance = Math.hypot(dx, dy);
    const bend = Math.sqrt(Math.max(0, 84 * 84 - distance * distance / 4));
    const kx = (hx + x) / 2 + dy / distance * bend, ky = (hy + y) / 2 - dx / distance * bend;
    set(`leg-${side}`, 'd', `M${hx} ${hy}Q${kx} ${ky} ${kx} ${ky}L${x} ${y}`);
    set(`foot-${side}`, 'd', `M${x - 4} ${y - 4}Q${x + 3} ${y - 1} ${x + 16} ${y + 3}L${x + 20} ${y + 7}H${x - 7}Z`);
    set(`pedal-${side}`, 'x', x - 14); set(`pedal-${side}`, 'y', y + 7);
    return [x, y];
  }
  function draw() {
    const angle = time * Math.PI * 1.25, bob = Math.sin(angle * 2) * 2;
    set('wheel-back', 'transform', `rotate(${time * 285})`); set('wheel-front', 'transform', `rotate(${time * 285})`);
    set('bird', 'transform', `translate(0 ${bob})`);
    const near = leg('near', angle, bob), far = leg('far', angle + Math.PI, bob);
    set('crank', 'd', `M${near[0]} ${near[1]}L${far[0]} ${far[1]}`);
    set('eye', 'transform', `translate(576 165) scale(1 ${time % 5.7 > 5.5 ? .12 : 1})`);
    set('scarf-tail', 'transform', `rotate(${Math.sin(time * 7) * 4} 533 223)`);
    set('verge', 'transform', `translate(${-(time * 188 % 1100)} 0)`);
    set('cloud-a', 'transform', `translate(${wrap(140 - time * 12, -150, 1300)} 112)`);
    set('cloud-b', 'transform', `translate(${wrap(700 - time * 7, -150, 1300)} 63) scale(.65)`);
    set('cloud-c', 'transform', `translate(${wrap(1003 - time * 10, -150, 1300)} 214) scale(.85)`);
    set('boat', 'transform', `translate(${wrap(944 - time * 14, -50, 1200)} ${348 + Math.sin(time * 1.5) * 1.3})`);
    set('gulls', 'transform', `translate(${wrap(-time * 18, -900, 2000)} ${Math.sin(time) * 4})`);
    set('sun-rays', 'transform', `rotate(${time * 2})`);
    set('bike-shadow', 'rx', 213 + bob * 1.5);
    set('breeze', 'transform', `translate(${Math.sin(time * 2.5) * 7} 0)`);
  }
  function frame(now) {
    if (last !== null && !paused && !document.hidden) time += Math.min((now - last) / 1000, .05) * speed;
    last = now;
    draw();
    set('bell-notes', 'opacity', Math.max(0, Math.min(1, (bellUntil - now) / 260)));
    requestAnimationFrame(frame);
  }
  updateControls(); draw(); requestAnimationFrame(frame);
})();
</script>
